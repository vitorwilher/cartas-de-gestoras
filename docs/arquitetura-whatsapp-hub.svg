<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" font-family="Inter,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
    <marker id="sv" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2f9e44"/></marker>
    <marker id="sr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6741d9"/></marker>
  </defs>
  <rect width="1120" height="900" fill="#ffffff"/>

  <text x="36" y="42" font-size="23" font-weight="700" fill="#0f172a">Automação de WhatsApp sem tocar no que já funciona</text>
  <text x="36" y="70" font-size="13.5" fill="#64748b">A Meta aceita UM webhook por WABA, e ele é do Kommo. Em vez de disputar esse lugar, invertemos:</text>
  <text x="36" y="89" font-size="13.5" fill="#64748b"><tspan font-weight="700" fill="#2f9e44">o Kommo avisa o nosso código.</tspan> Número, WABA e a rotina da Raiane ficam exatamente como estão.</text>
  <text x="36" y="108" font-size="12.5" font-weight="700" fill="#2f9e44">✓ Fase 1 provada em 09/09 com duas mensagens reais (Alan e Luiz) — nada do que existia foi afetado.</text>

  <!-- INTOCADO -->
  <rect x="36" y="126" width="470" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="54" y="152" font-size="13" font-weight="700" fill="#64748b">NADA AQUI MUDA</text>

  <rect x="54" y="166" width="200" height="66" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/>
  <text x="70" y="190" font-size="13.5" font-weight="700" fill="#0f172a">WhatsApp Cloud API</text>
  <text x="70" y="211" font-size="11.5" fill="#64748b">+55 21 97116-7250 · GREEN</text>

  <rect x="286" y="166" width="200" height="66" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.4"/>
  <text x="302" y="190" font-size="13.5" font-weight="700" fill="#0f172a">Kommo</text>
  <text x="302" y="211" font-size="11.5" fill="#64748b">webhook da WABA · dono do chat</text>

  <rect x="54" y="248" width="432" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="70" y="270" font-size="13" font-weight="700" fill="#0f172a">Raiane</text>
  <text x="70" y="290" font-size="11.5" fill="#64748b">atende no board, na thread nativa — sem nenhuma mudança de rotina</text>

  <path d="M256 199 L282 199" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#s)"/>
  <path d="M386 226 L386 236" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#s)"/>

  <!-- O NOVO -->
  <text x="546" y="132" font-size="13" font-weight="700" fill="#6741d9">O QUE ENTRA (só ouve, no começo)</text>
  <rect x="546" y="146" width="458" height="168" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.8"/>
  <text x="564" y="172" font-size="14" font-weight="700" fill="#0f172a">Endpoint próprio</text>
  <text x="564" y="193" font-size="11.5" fill="#64748b">Cloudflare Worker ou Cloud Run — os dois já rodam na casa</text>

  <rect x="564" y="208" width="422" height="44" rx="7" fill="#ffffff" stroke="#6741d9" stroke-width="1.3"/>
  <text x="580" y="228" font-size="12.5" font-weight="700" fill="#0f172a">webhook add_talk</text>
  <text x="580" y="245" font-size="11.5" fill="#475569">testado: HTTP 201 — o Kommo dispara quando abre conversa</text>

  <rect x="564" y="270" width="422" height="38" rx="7" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.3"/>
  <text x="580" y="286" font-size="12" fill="#0f172a">FASE 1 — só imprime o JSON no log. Não responde, não grava, não altera.</text>

  <path d="M488 191 L542 205" stroke="#6741d9" stroke-width="1.8" fill="none" marker-end="url(#sr)"/>
  <text x="470" y="176" font-size="11" fill="#6741d9">avisa</text>

  <!-- FASES -->
  <text x="36" y="356" font-size="13" font-weight="700" fill="#0f172a">AS FASES — cada uma só começa quando a anterior estiver provada</text>

  <rect x="36" y="372" width="234" height="150" rx="9" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.6"/>
  <text x="54" y="398" font-size="13.5" font-weight="700" fill="#2f9e44">FASE 1 · ouvir  ✓</text>
  <text x="54" y="422" font-size="12" font-weight="700" fill="#0f172a">PROVADA em 09/09</text>
  <text x="54" y="443" font-size="11.5" fill="#0f172a">2 mensagens reais chegaram</text>
  <text x="54" y="461" font-size="11.5" fill="#0f172a">talk_id 106564 e 106565</text>
  <text x="54" y="486" font-size="11.5" fill="#64748b">origin=waba · contact_id →</text>
  <text x="54" y="503" font-size="11.5" fill="#64748b">nome e telefone do lead</text>

  <rect x="288" y="372" width="234" height="150" rx="9" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.6"/>
  <text x="306" y="398" font-size="13.5" font-weight="700" fill="#1971c2">FASE 2 · registrar ←</text>
  <text x="306" y="422" font-size="12" font-weight="700" fill="#0f172a">AGORA</text>
  <text x="306" y="443" font-size="11.5" fill="#0f172a">Resolver o telefone no Kommo</text>
  <text x="306" y="461" font-size="11.5" fill="#0f172a">e cruzar com o lead da landing</text>
  <text x="306" y="486" font-size="11.5" fill="#64748b">Risco: nenhum. Ainda não</text>
  <text x="306" y="503" font-size="11.5" fill="#64748b">envia nada para ninguém.</text>

  <rect x="540" y="372" width="234" height="150" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
  <text x="558" y="398" font-size="13.5" font-weight="700" fill="#e8590c">FASE 3 · responder</text>
  <text x="558" y="422" font-size="12" fill="#0f172a">Enviar o PDF pela</text>
  <text x="558" y="441" font-size="12" fill="#0f172a">Cloud API (token já existe)</text>
  <text x="558" y="460" font-size="12" fill="#0f172a">só para leads de captação</text>
  <text x="558" y="486" font-size="11.5" fill="#64748b">Risco: mensagem indevida.</text>
  <text x="558" y="503" font-size="11.5" fill="#64748b">Testar só com o seu número.</text>

  <rect x="792" y="372" width="212" height="150" rx="9" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1.6"/>
  <text x="810" y="398" font-size="13.5" font-weight="700" fill="#c92a2a">FASE 4 · follow-up</text>
  <text x="810" y="422" font-size="12" fill="#0f172a">Mensagem de D+1</text>
  <text x="810" y="441" font-size="12" fill="#0f172a">dentro da janela de 24h</text>
  <text x="810" y="467" font-size="11.5" fill="#64748b">Risco: incomodar cliente</text>
  <text x="810" y="484" font-size="11.5" fill="#64748b">de verdade. Só depois de</text>
  <text x="810" y="501" font-size="11.5" fill="#64748b">as três anteriores rodarem.</text>

  <!-- JA PRONTO -->
  <rect x="36" y="552" width="652" height="152" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="54" y="578" font-size="13.5" font-weight="700" fill="#2f9e44">JÁ VERIFICADO (09/09) — não precisa descobrir de novo</text>
  <text x="54" y="602" font-size="12" fill="#0f172a">✓ add_talk aceito pelo Kommo — HTTP 201 (criado e removido no teste)</text>
  <text x="54" y="623" font-size="12" fill="#0f172a">✓ Já rodam 2 webhooks do Kommo, um num Cloud Run seu (amblack-webhook)</text>
  <text x="54" y="644" font-size="12" fill="#0f172a">✓ Token System User com whatsapp_business_messaging — não expira</text>
  <text x="54" y="665" font-size="12" fill="#0f172a">✓ 4 Cloudflare Workers em produção · PDF em URL fixa no GCS</text>
  <text x="54" y="686" font-size="12" fill="#c92a2a">✗ A API do Kommo NÃO injeta mensagem no chat (endpoint privado, 403)</text>

  <rect x="708" y="552" width="296" height="152" rx="9" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="726" y="578" font-size="13.5" font-weight="700" fill="#c92a2a">CUIDADO</text>
  <text x="726" y="604" font-size="12" fill="#0f172a">O IP foi bloqueado em 08/09 por</text>
  <text x="726" y="623" font-size="12" fill="#0f172a">excesso de chamadas ao Kommo.</text>
  <text x="726" y="649" font-size="12" fill="#0f172a">Espaçar requisições. Não sondar</text>
  <text x="726" y="668" font-size="12" fill="#0f172a">endpoints em série.</text>
  <text x="726" y="694" font-size="11.5" fill="#64748b">Perguntar antes de explorar.</text>

  <!-- ESCALA -->
  <rect x="36" y="730" width="968" height="130" rx="9" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="54" y="756" font-size="13.5" font-weight="700" fill="#6741d9">POR QUE VALE PARA QUALQUER PROJETO</text>
  <text x="54" y="782" font-size="12.5" fill="#0f172a">O endpoint não sabe o que é "Cartas de Gestoras". Ele recebe a conversa e consulta um mapa: de qual landing veio,</text>
  <text x="54" y="803" font-size="12.5" fill="#0f172a">qual PDF entregar, qual tag do Kit aplicar, qual sequência disparar.</text>
  <text x="54" y="829" font-size="12.5" font-weight="600" fill="#6741d9">Projeto novo = uma linha nova no mapa. Sem código, sem deploy, sem tocar no WhatsApp.</text>
</svg>
