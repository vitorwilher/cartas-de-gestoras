name: Cartas das Gestoras

on:
  schedule:
    # Terças, 10:00 UTC = 07:00 em São Paulo (UTC-3).
    - cron: "0 10 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cartas-das-gestoras
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # O layout usa a extensão `am-livro` (Typst), e o Quarto 1.9+ já traz o
      # Typst embutido — TinyTeX deixou de ser necessário aqui.
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar dependências
        run: pip install -r requirements.txt gcsfs

      - name: Testar regras de estado e formatação
        run: python -m unittest discover -s tests -v

      - name: Validar secrets obrigatórios
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
        run: |
          for name in ANTHROPIC_API_KEY WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_TO_NUMBER; do
            if [ -z "${!name}" ]; then
              echo "Secret obrigatório ausente: $name" >&2
              exit 1
            fi
          done

      - name: Coletar, sintetizar, renderizar e enviar
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
          WHATSAPP_WABA_ID: "1421867178829333"
          WHATSAPP_CARTAS_TEMPLATE: "sintese_cartas_gestoras"
        run: python cartas.py --pdf --send

      # A URL do PDF é FIXA (cartas/edicao-atual.pdf): o ManyChat e a landing do
      # ConvertKit apontam sempre para ela, e o arquivo é sobrescrito aqui toda
      # semana. Falha aqui não derruba a edição — o PDF já foi gerado e enviado
      # por WhatsApp; só o link público fica com a versão anterior.
      - name: Publicar o PDF no GCS (URL fixa)
        continue-on-error: true
        env:
          SOCIAL_GCS_BUCKET: ${{ secrets.SOCIAL_GCS_BUCKET }}
          GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GCS_CREDENTIALS_JSON" ]; then
            echo "GCS_CREDENTIALS_JSON ausente; pulando a publicação." >&2
            exit 0
          fi
          printf '%s' "$GCS_CREDENTIALS_JSON" > /tmp/gcs.json
          GCS_CREDENTIALS_PATH=/tmp/gcs.json python divulgacao/publicar_pdf.py
          rm -f /tmp/gcs.json

      - name: Commitar síntese e estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/resumo/ gestoras/gestoras.yml
          if git diff --staged --quiet; then
            echo "Nada para commitar."
          else
            git commit -m "cartas: $(date -u +%Y-%m-%d)"
            git push
          fi
