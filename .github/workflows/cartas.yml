name: Cartas das Gestoras

on:
  schedule:
    # Terças, 10:00 UTC = 07:00 em São Paulo (UTC-3).
    - cron: "0 10 * * 2"
  workflow_dispatch:
    inputs:
      nota:
        description: "Nota editorial da edição (caixa no PDF + parágrafo no e-mail). Vazio no cron."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cartas-das-gestoras
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # O layout usa a extensão `am-livro` (Typst), e o Quarto 1.9+ já traz o
      # Typst embutido — TinyTeX deixou de ser necessário aqui.
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar regras de estado e formatação
        run: python -m unittest discover -s tests -v

      - name: Validar secrets obrigatórios
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
        run: |
          for name in ANTHROPIC_API_KEY WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_TO_NUMBER; do
            if [ -z "${!name}" ]; then
              echo "Secret obrigatório ausente: $name" >&2
              exit 1
            fi
          done

      - name: Coletar, sintetizar, renderizar e enviar
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
          WHATSAPP_WABA_ID: "1421867178829333"
          WHATSAPP_CARTAS_TEMPLATE: "sintese_cartas_gestoras"
          # Via env, nunca interpolada no script: a nota é texto livre.
          NOTA: ${{ inputs.nota }}
        run: python cartas.py --pdf --send ${NOTA:+--nota "$NOTA"}

      # A síntese é paga desde 07/10/2026: o assinante recebe a edição como aula
      # no curso 73334 (PDF atrás de /download, só logado). Sem este passo a
      # edição sai para os leads e NÃO chega a quem paga. Idempotente: numa
      # terça sem carta nova, não cria nada. Roda ANTES do e-mail, que diz que
      # a edição está na área do aluno.
      - name: Publicar a edição no curso dos assinantes
        id: curso
        continue-on-error: true
        env:
          WP_LOJA_URL: ${{ secrets.WP_LOJA_URL }}
          WP_LOJA_USER: ${{ secrets.WP_LOJA_USER }}
          WP_LOJA_APP_PASSWORD: ${{ secrets.WP_LOJA_APP_PASSWORD }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          DLM_API_PUBLIC_KEY: ${{ secrets.DLM_API_PUBLIC_KEY }}
          DLM_API_SECRET_KEY: ${{ secrets.DLM_API_SECRET_KEY }}
        run: |
          faltando=""
          for n in WP_LOJA_URL WP_LOJA_USER WP_LOJA_APP_PASSWORD WC_CONSUMER_KEY WC_CONSUMER_SECRET DLM_API_PUBLIC_KEY DLM_API_SECRET_KEY; do
            [ -z "${!n}" ] && faltando="$faltando $n"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Edição NÃO publicada para os assinantes — secrets ausentes:$faltando"
            echo "status=pulado (secrets ausentes)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python assinatura/curso.py --publicar
          echo "status=success" >> "$GITHUB_OUTPUT"

      # Sem publicação no GCS desde 13/10/2026: a síntese virou assinatura e a
      # URL pública (cartas/edicao-atual.pdf) entregava a edição paga a qualquer
      # um com o link. A entrega é o curso 73334; `divulgacao/publicar_pdf.py`
      # fica no repositório, mas não roda mais.

      # Assinantes e leads recebem e-mails diferentes, e a v4 do Kit só aceita uma
      # tag por filtro de broadcast. Este passo põe quem tem assinatura ativa na
      # tag de assinantes e TIRA da de leads (e o inverso para quem cancelou).
      # Se falhar, o e-mail dos leads sai assim mesmo — como era até 31/10.
      - name: Separar assinantes e leads no Kit
        id: tags
        continue-on-error: true
        env:
          WP_LOJA_URL: ${{ secrets.WP_LOJA_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          CONVERT_KIT_V4: ${{ secrets.CONVERT_KIT_V4 }}
        run: python assinatura/tag_assinantes.py

      # O e-mail da semana, para a tag deste projeto (Leads - Cartas Semanais).
      # É AGENDADO para ~30 min à frente, não disparado no ato: enquanto está
      # `scheduled` dá para cancelar no painel se a edição saiu errada. O script
      # se recusa a criar sem segmento gravado ou com a tag vazia.
      #
      # Precisa das DUAS credenciais: CONVERT_KIT_V4 escreve o broadcast (a v3
      # descarta o subscriber_filter em silêncio e mandaria para a lista inteira);
      # CONVERTKIT_API_SECRET só conta quantas pessoas a tag alcança.
      - name: Enviar o e-mail da semana
        id: email
        continue-on-error: true
        env:
          CONVERT_KIT_V4: ${{ secrets.CONVERT_KIT_V4 }}
          CONVERTKIT_API_SECRET: ${{ secrets.CONVERTKIT_API_SECRET }}
          NOTA: ${{ inputs.nota }}
        run: |
          # As DUAS credenciais são necessárias: sem CONVERTKIT_API_SECRET o
          # script não consegue contar a tag e aborta como se estivesse vazia.
          # Checar só uma delas daria "sucesso" sem e-mail nenhum.
          faltando=""
          [ -z "$CONVERT_KIT_V4" ] && faltando="$faltando CONVERT_KIT_V4"
          [ -z "$CONVERTKIT_API_SECRET" ] && faltando="$faltando CONVERTKIT_API_SECRET"
          # Sair com 0 aqui daria `success` no resumo sem
          # e-mail nenhum. O status real vai num output próprio.
          if [ -n "$faltando" ]; then
            echo "::warning::E-mail da semana NÃO enviado — secrets ausentes:$faltando"
            echo "status=pulado (secrets ausentes)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python divulgacao/broadcast_semanal.py --enviar --espera 30 ${NOTA:+--nota "$NOTA"}
          echo "status=success" >> "$GITHUB_OUTPUT"

      # O e-mail de quem paga: o resumo e o link da edição no curso, sem convite
      # para assinar. Só sai se a edição chegou ao curso — ele diz "já está na sua
      # área do aluno", e isso precisa ser verdade.
      - name: Enviar o e-mail dos assinantes
        id: email_assinantes
        if: steps.curso.outputs.status == 'success'
        continue-on-error: true
        env:
          CONVERT_KIT_V4: ${{ secrets.CONVERT_KIT_V4 }}
          CONVERTKIT_API_SECRET: ${{ secrets.CONVERTKIT_API_SECRET }}
          NOTA: ${{ inputs.nota }}
        run: |
          python divulgacao/broadcast_semanal.py --publico assinantes --enviar --espera 30 ${NOTA:+--nota "$NOTA"}
          echo "status=success" >> "$GITHUB_OUTPUT"

      # O post da semana (LinkedIn + Instagram) a partir da edição: a rotina
      # agendada na nuvem pega o pacote em divulgacao/semana/AAAA-MM-DD/ e agenda
      # no mLabs para quarta, 12h. Sem carta nova, não gera nada (frescor). Se o
      # post não passar na checagem (número sem fonte, preço, link), o pacote NÃO
      # é gravado — uma semana sem post, nunca um post errado no ar.
      - name: Gerar o post da semana
        id: post
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          antes=$(ls divulgacao/semana 2>/dev/null | wc -l)
          python divulgacao/post_semanal.py
          depois=$(ls divulgacao/semana 2>/dev/null | wc -l)
          if [ "$depois" -gt "$antes" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=nada a fazer (sem edição nova)" >> "$GITHUB_OUTPUT"
          fi

      # Um passo `continue-on-error` que falha deixa o run VERDE. Sem este
      # resumo, "PDF não publicado" e "e-mail não enviado" seriam invisíveis:
      # o ícone verde diria que a semana correu bem. Aqui o resultado de cada
      # canal vira uma linha no Summary do run — e um aviso quando falha.
      - name: Resumo da execução
        if: always()
        run: |
          # O `status` do passo distingue "pulou por falta de secret" de "fez".
          # Vazio significa que o passo morreu antes de gravá-lo: vale o outcome.
          curso="${{ steps.curso.outputs.status }}"
          email="${{ steps.email.outputs.status }}"
          post="${{ steps.post.outputs.status }}"
          tags="${{ steps.tags.outcome }}"
          email_ass="${{ steps.email_assinantes.outputs.status }}"
          [ -z "$email_ass" ] && email_ass="${{ steps.email_assinantes.outcome }}"
          [ -z "$curso" ] && curso="${{ steps.curso.outcome }}"
          [ -z "$email" ] && email="${{ steps.email.outcome }}"
          [ -z "$post" ] && post="${{ steps.post.outcome }}"

          {
            echo "## Cartas das Gestoras — $(date -u +'%d/%m/%Y')"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Edição no curso (assinantes) | $curso |"
            echo "| Assinantes separados dos leads no Kit | $tags |"
            echo "| E-mail da semana (leads) | $email |"
            echo "| E-mail dos assinantes | $email_ass |"
            echo "| Post da semana (pacote para o mLabs) | $post |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$curso" != "success" ]; then
            echo "::error::A edição NÃO chegou ao curso dos assinantes ($curso). Rode: python assinatura/curso.py --publicar"
          fi
          if [ "$tags" != "success" ]; then
            echo "::warning::A separação assinantes/leads falhou ($tags): assinantes podem ter recebido o e-mail de venda."
          fi
          case "$email_ass" in success|skipped) ;; *)
            echo "::warning::O e-mail dos assinantes NÃO saiu ($email_ass)." ;;
          esac
          case "$post" in success|nada*) ;; *)
            echo "::warning::O post da semana NÃO foi gerado ($post). Sem pacote, a rotina do mLabs não publica nada." ;;
          esac
          if [ "$email" != "success" ]; then
            echo "::warning::O e-mail da semana NÃO saiu ($email). Verifique o log do passo."
          fi

      - name: Commitar síntese e estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/resumo/ gestoras/gestoras.yml divulgacao/semana/
          if git diff --staged --quiet; then
            echo "Nada para commitar."
          else
            git commit -m "cartas: $(date -u +%Y-%m-%d)"
            git push
          fi
